name: Publish MAZ Coast Racing 0.3
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-coast-racing-0-3.yml

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      APK: MAZ-Coast-Racing-0.3.apk
      TAG: coast-racing-0.3
      BUILD_SHA: 141b627632d07c386f392d738c88eb84a11b95a4
    steps:
      - name: Verify and extract the tested Android build
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/actions/artifacts/14971222270/zip" > build.zip
          echo '428175e38d5fde494535d177c31f203d21e14efb10d696e578efbc350c6e485e  build.zip' | sha256sum --check
          unzip -p build.zip "$APK" > "$APK"
          unzip -tq "$APK"
          test -s "$APK"
      - name: Publish stable Android download
        run: |
          set -euo pipefail
          gh release create "$TAG" "$APK" --target "$BUILD_SHA" --title "MAZ Coast Racing 0.3" --notes "Spectral Edition for Android. Debug-signed testing build."
          sha256sum "$APK"
